<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Service Info</title>
    <link rel="stylesheet" href="../style.css">
  </head>
  <body style="width: 100%; max-width: 480px; margin: 10px auto;">



 	<div class="title-bar">
      <div style="display: flex; width: 100%; margin-bottom: 10px; align-items: center;">
        <div class="vertical" style="flex: 4; padding-left: 10px;">
          <p style="font-size: 16px;" id="customerName" > Balakrishnan </p>
          <p id="customerAddress">Vadugapalayam</p>
        </div>

        <div class="vertical" style="flex: 1;">
          <div class="credit-text" style="font-size: 18px;" id="creditText"></div>
          <div class="balance-text" style="font-size: 18px;" id="balanceText"></div>
        </div>
      </div>
    </div>



  	<div class="table-outline" style="margin-bottom: 10px;">
      <div class="horizontal">
        <div class="icon" style="width: 42px; height: 42px;">
          <span class="material-icons" style="font-size: 28px; margin: 0px;">directions_car</span>
        </div>
        <div class="vertical"style="margin-left: 10px;">
          <p id="model" style="font-size: 14px;">Skoda - Slavia</p>
          <p id="vehicleNo"style="font-size: 14px;"> TN42 AA7608</p>
        </div>
      </div>
      <div class="divider-horizontal"></div>
      <table class="bill-table">
        <tr>
          <td class="label" >
            <div>Service Date</div>
            <div>Bill Number</div>
            <div>Odometer</div>
            <div>Bill Amount</div>
            <div>Paid Amount</div>
          </td>
          <td class="value">
            <div id="date">24.07.2026 11:56 AM</div>
            <div id="billNo">INV260712</div>
            <div id="onKm">78,789 km</div>
            <div id="billAmount">₹5,800</div>
            <div id="paidAmount">₹5,500</div>
          </td>
        </tr>
      </table>
    </div>


    <div class="title-bar">
      <h4>Spares And Service</h4>
  	</div>

    <div id="serviceList"></div>

    <script type="module" src="script.js"></script>
    
  </body>
</html>
